<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex bg-black">
        <div class="left">
            <div class="home bg-grey rounded m-1 p-1">
                <div class="svg"><img class="invert" src="logo.svg" alt="">Spotify</div>
                <ul>
                    <li><img class="invert" src="home.svg" alt="Home Icon">Home</li>
                    <li><img class="invert" src="search.svg" alt="Search Icon">Search</li>
                </ul>
            </div>

            <div class="library bg-grey rounded m-1 p-1">
                <div class="svg"><img class="invert" src="library.svg" alt=""> Your Library </div>
                <div class="svg-add"><img class="invert" src="add.svg" alt=""> Create Playlist </div>
            </div>
        </div>

        <div class="right border "></div>
    </div>
</body>

</html>
